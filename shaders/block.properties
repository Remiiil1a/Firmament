# ===========================================================================
# BATCH 747: THE BLOCKS THE COMPARISON FOUND
# ===========================================================================
#
# The author said his own list was incomplete, so this batch compared our
# block.properties against Eclipse's rather than working from the list. The tool
# is _team_bfog/block_coverage_747.py and its output is in BATCH_LOG 747.
#
# It found 490 vanilla names Eclipse assigns and we did not, in 43 Eclipse ids.
# Most of those are Eclipse's opaque group - 183 plain building blocks at
# block.503, ores, wool, ice - and those are CORRECT as walls: an id that only
# says "this is solid" is the answer SOLID_UNLISTED already gives. The entries
# below are the subset that matters, where Eclipse says "light source" or "light
# passes through" and we said "wall".
#
# ⚠️ EVERY ID BELOW IS ABOVE 50 AND IS DEMOTED IN FetchMaterialID. EncodePerFace
# keeps four bits, so 51 arrives in the fragment stage as 3 - SUBSURFACE_SCATTERING
# - and a copper bulb would be given subsurface scattering. See the table in
# lit.vsh.

# --- light sources -------------------------------------------------------
#
# Split by RANGE rather than by colour, because the fill carries a level and
# these disagree with their neighbours about it. A copper bulb is 15 and a
# redstone ore is 7; LIGHT_WARM is 14 and LIGHT_REDSTONE is 7.
block.10051=copper_bulb waxed_copper_bulb
# The three oxidised states share one id, so they share one range: 8, the average
# of 12, 8 and 4. Recorded rather than silently picked - a weathered bulb is
# exact and the other two are off by four.
block.10052=exposed_copper_bulb weathered_copper_bulb \
	oxidized_copper_bulb waxed_exposed_copper_bulb \
	waxed_weathered_copper_bulb waxed_oxidized_copper_bulb
