# Light-emitting blocks, grouped by the color of the light they give off.
#
# The colors themselves are in /environment/lighting/light_colors.glsl, and the
# material IDs are in /environment/materialIDs.glsl.
#
# Only blocks whose light is a different color from their texture are listed.
# Froglights, for instance, are already the color they glow, so they keep their
# own color. Blocks whose emission depends on a block state - a lit furnace, a
# shrieking sculk shrieker - can be listed safely: whether a face glows at all
# is still decided by the light map, so an unlit one does not glow.
#
# Nothing here changes which blocks cast shadows, or anything else about how
# they are shaded. These IDs exist only to give light sources a color.
block.10007=torch wall_torch lantern glowstone jack_o_lantern shroomlight \
	furnace blast_furnace smoker
block.10008=soul_torch soul_wall_torch soul_lantern soul_fire
block.10009=redstone_torch redstone_wall_torch redstone_lamp
