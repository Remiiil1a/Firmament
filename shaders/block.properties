# The medium and small amethyst bud stages have sprites in vanilla_textures as
# well and are deliberately not listed: this batch's light list stops at the
# large bud. If the game treats them as light sources, the fill treats them as
# walls instead, which is a game-test item rather than a code choice - recorded
# here so the next batch does not read the omission as an oversight.

# The light families added in batch 697.
#
# The numbers are 40 to 43 and not 16 to 19, and the reason is the geometry
# selector: the number after 10000 is decoded as a material by lit.vsh, where
# bits 4 to 7 are the selector and only 1 is defined. 16 to 19 would be
# selector 1 and their blocks would be answered as diagonal-only geometry -
# GLASS on horizontal diagonal faces and GENERIC on the rest - which is not
# what a light source is allowed to look like in the gbuffers stage. Selector 2
# is not defined, so the whole number survives, which is what the shadow
# program needs to look the family up in the palette. Four entries share
# selector 2 now; see the note in /environment/materialIDs.glsl for why that is
# safe.
#
# The copper family is the torches - which come in one state each, standing and
# wall - and the lanterns in every oxidation state, including the waxed ones,
# which the reference packs list as separate registry blocks. vanilla_textures
# ships no separate waxed sprites (waxed variants reuse the unwaxed ones), so
# those names are unproven here; Iris ignores an unknown block name silently, so
# the cost of being wrong is one missing entry rather than an error, and this
# batch leaves them in as the documented guess. The frog lights are listed even
# though their own
# texture already carries their color: since batch 696 the flood fill treats a
# block that is in no family as a wall, so an unlisted light source would stop
# light at its own voxel instead of starting it.
#
# Copper bulbs are emitters in the game and are deliberately not here: their
# light is state-dependent (they glow only while powered and lit), which a
# palette entry cannot express - the write side sees a block number, not a
# block state - and they are not on the author's list. Not an oversight; a next
# batch that wants them has to decide what an unlit bulb should do first.
block.10040=ochre_froglight
block.10041=verdant_froglight
block.10042=pearlescent_froglight
