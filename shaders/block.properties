# The nether portal.
#
# The one block in this file whose ID is not a material, and the only place a
# block has ever been given 10038. Nothing else in the pack should look for it
# except the shadow program, which is the one place that reads the raw ID: the
# world programs are asked what a block's material is by lit.vsh, and lit.vsh
# answers GLASS for this one, exactly as it did before the ID existed. See
# NETHER_PORTAL in /environment/materialIDs.glsl.
#
# It is here, alone, rather than in a group with anything else, because being
# alone is the property that makes it safe - no other block can be meant by it.
block.10038=nether_portal

# The end portal.
#
# Unlike 10038 above this one is never read as mc_Entity.x: the end portal is drawn
# by a BLOCK ENTITY renderer, so block.properties feeds it to the program as the
# blockEntityId uniform instead. That is the only difference - the number means the
# same thing, and nothing else is given it. See END_PORTAL_BLOCK_ID in
# /environment/materialIDs.glsl and PORTAL_EFFECTS in /program/world/lit.fsh.
#
# The gateway is not listed here on purpose: it already has 10012, shared with the
# end rod, and a gateway is the one block that is both a light source and a portal
# surface - it arrives through the same uniform, so it needs no second number.
block.10039=end_portal

