# Stained glass and its panes, plus tinted glass.
#
# A material of its own rather than part of the glass above, because the colour
# of the light that has come through stained glass is what stained glass is for,
# and that colour is a colour this pack has to be able to look up by material.
# It is not grouped with the blocks above because those are the ones that cast
# nothing at all; see COLORED_SHADOWS in /environment/materialIDs.glsl for what
# this material does with the light instead.
#
# Since batch 697 it is also a filter for the flood fill: the shadow program's
# fragment stage writes this block's own texture color into the voxel it
# occupies, marked as a filter (alpha 0.5 in the world image's encoding), and
# the fill multiplies whatever passes that voxel by it. See the note on that
# write in /program/shadow/shadow.fsh. The two uses read the same texture and
# mean different things by it - one tints sunlight, the other tints voxel light
# - so neither is derived from the other.
block.10015=white_stained_glass orange_stained_glass magenta_stained_glass \
	light_blue_stained_glass yellow_stained_glass lime_stained_glass \
	pink_stained_glass gray_stained_glass light_gray_stained_glass \
	cyan_stained_glass purple_stained_glass blue_stained_glass \
	brown_stained_glass green_stained_glass red_stained_glass \
	black_stained_glass tinted_glass \
	white_stained_glass_pane orange_stained_glass_pane \
	magenta_stained_glass_pane light_blue_stained_glass_pane \
	yellow_stained_glass_pane lime_stained_glass_pane pink_stained_glass_pane \
	gray_stained_glass_pane light_gray_stained_glass_pane \
	cyan_stained_glass_pane purple_stained_glass_pane blue_stained_glass_pane \
