# The nether portal.
#
# The one block in this file whose ID is not a material, and the only place a
# block has ever been given 10038. Nothing else in the pack should look for it
# except the shadow program, which is the one place that reads the raw ID: the
# world programs are asked what a block's material is by lit.vsh, and lit.vsh
# answers GLASS for this one, exactly as it did before the ID existed. See
# NETHER_PORTAL in /environment/materialIDs.glsl.
#
# It is here, alone, rather than in a group with anything else, because being
# alone is the property that makes it safe - no other block can be meant by it.
block.10038=nether_portal

# The end portal.
#
# Unlike 10038 above this one is never read as mc_Entity.x: the end portal is drawn
# by a BLOCK ENTITY renderer, so block.properties feeds it to the program as the
# blockEntityId uniform instead. That is the only difference - the number means the
# same thing, and nothing else is given it. See END_PORTAL_BLOCK_ID in
# /environment/materialIDs.glsl and PORTAL_EFFECTS in /program/world/lit.fsh.
#
# The gateway is not listed here on purpose: it already has 10012, shared with the
# end rod, and a gateway is the one block that is both a light source and a portal
# surface - it arrives through the same uniform, so it needs no second number.
block.10039=end_portal

# Subsurface Scattering No Waving on Diagonal Geometry
#
# BATCH 752 TOOK THE POTTED PLANTS OUT OF THIS GROUP. They were here with
# grass_block, and this number carries the diagonal geometry selector, so they
# arrived at the coloured light fill as 19 - which LightVolumeOpaque does not name,
# so it called them walls. A potted flower blocked a torch's light like a block of
# stone while the same flower in the ground passed it. They have their own group
# below now; grass_block stays here, because the ground must stay a wall.
block.10019=grass_block

# Blocks that do not cast shadows on Diagonal Geometry
# TODO: Support this in the shadowmap
#
# Soul campfires were here as well until batch 697. A block has one ID, and
# this one is a behavior number - it gives the block GLASS as its material
# nibble plus the diagonal selector - so a soul campfire listed here could not
# also be a light source. It moved to the soul family, block.10008. Nothing in
# the pack tests 10022 (its only mentions outside this file are two notes in
# /environment/materialIDs.glsl), so the selector the soul campfire loses with
# the move changes nothing that is implemented.
block.10022=campfire

# Light-emitting blocks, grouped by the color of the light they give off.
#
# The colors themselves are in /environment/lighting/light_colors.glsl, and the
# material IDs are in /environment/materialIDs.glsl.
#
# Since batch 696 this list is also the flood fill's emitter list: the shadow
# program looks a block up here and writes its color into the world image, and a
# block in no family is a wall to that fill. Blocks whose emission depends on a
# block state - a lit furnace, a shrieking sculk shrieker - can be listed safely
# for the fragment stage: whether a face glows at all is still decided by the
# light map, so an unlit one does not glow.
#
# Nothing here changes which blocks cast shadows, or anything else about how
# they are shaded. These IDs exist to give light sources a color.
block.10007=torch wall_torch lantern glowstone jack_o_lantern shroomlight \
	furnace blast_furnace smoker
block.10008=soul_torch soul_wall_torch soul_lantern soul_fire soul_campfire
# Soul campfires were in block.10022 until batch 697, which is a behavior
# number and gave them no color at all. A block has one ID, so it moved here
# to be a soul light; the diagonal geometry selector 10022 carries is gone from
# it, and that is unobservable because nothing in the pack tests 10022 - see
# the note there.
block.10009=redstone_torch redstone_wall_torch
block.10010=lava
block.10011=sea_lantern conduit beacon
block.10012=end_rod end_gateway
block.10013=crying_obsidian sculk_catalyst
block.10014=respawn_anchor enchanting_table
# The medium and small amethyst bud stages have sprites in vanilla_textures as
# well and are deliberately not listed: this batch's light list stops at the
# large bud. If the game treats them as light sources, the fill treats them as
# walls instead, which is a game-test item rather than a code choice - recorded
# here so the next batch does not read the omission as an oversight.
#
# Batch 739 took the large bud out of this family and gave it 10046, and the
# reason is the same one that split the redstone lamp and the magma block: the
# fill now carries a light LEVEL, and a large amethyst bud is level 5 where an
# enchanting table is 7. See the note on the split families in
# /environment/materialIDs.glsl.

# The light families added in batch 697.
#
# The numbers are 40 to 43 and not 16 to 19, and the reason is the geometry
# selector: the number after 10000 is decoded as a material by lit.vsh, where
# bits 4 to 7 are the selector and only 1 is defined. 16 to 19 would be
# selector 1 and their blocks would be answered as diagonal-only geometry -
# GLASS on horizontal diagonal faces and GENERIC on the rest - which is not
# what a light source is allowed to look like in the gbuffers stage. Selector 2
# is not defined, so the whole number survives, which is what the shadow
# program needs to look the family up in the palette. Four entries share
# selector 2 now; see the note in /environment/materialIDs.glsl for why that is
# safe.
#
# The copper family is the torches - which come in one state each, standing and
# wall - and the lanterns in every oxidation state, including the waxed ones,
# which the reference packs list as separate registry blocks. vanilla_textures
# ships no separate waxed sprites (waxed variants reuse the unwaxed ones), so
# those names are unproven here; Iris ignores an unknown block name silently, so
# the cost of being wrong is one missing entry rather than an error, and this
# batch leaves them in as the documented guess. The frog lights are listed even
# though their own
# texture already carries their color: since batch 696 the flood fill treats a
# block that is in no family as a wall, so an unlisted light source would stop
# light at its own voxel instead of starting it.
#
# Copper bulbs are emitters in the game and are deliberately not here: their
# light is state-dependent (they glow only while powered and lit), which a
# palette entry cannot express - the write side sees a block number, not a
# block state - and they are not on the author's list. Not an oversight; a next
# batch that wants them has to decide what an unlit bulb should do first.
block.10040=ochre_froglight
block.10041=verdant_froglight
block.10042=pearlescent_froglight
block.10043=copper_torch copper_wall_torch copper_lantern \
	exposed_copper_lantern weathered_copper_lantern oxidized_copper_lantern \
	waxed_copper_lantern waxed_exposed_copper_lantern \
	waxed_weathered_copper_lantern waxed_oxidized_copper_lantern

# The three families split out in batch 739, when the fill started carrying a
# light level rather than only a colour.
#
# Each of these was one member of a family above until the reach of a source
# became its own number. A lit redstone lamp is level 15 and a redstone torch is 7;
# a magma block is 3 and lava is 15; a large amethyst bud is 5 and an enchanting
# table is 7. While a family was only a colour, the lumping cost nothing. Now it
# would make a lamp reach half as far as the game says it does.
#
# The numbers continue the 40-43 block, which is selector 2 - see the note above on
# why a light family has to live above 31, and the note on the split families in
# /environment/materialIDs.glsl.
block.10044=redstone_lamp
block.10045=magma_block
block.10046=amethyst_cluster large_amethyst_bud

# The non-cube shapes, added in batch 745.
#
# Until this batch none of these blocks had an ID, so they decoded to GENERIC,
# the writer stored SOLID_UNLISTED for them, and the fill called them walls - a
# sign stopped a torch's light like stone. The author's sixth report.
#
# Three groups rather than one, because the fill carries one scalar tint per block
# and these shapes obstruct light by different amounts. The values are in
# LightVolumeFilterTint in /environment/lighting/light_volume.glsl, with the
# reasoning; the grouping here is by how much of its voxel the block fills.
#
# ⚠️ These numbers are selector 3 (48-63), which is not defined, so they survive
# the shadow program's raw decode intact - the same argument that puts the light
# families at 40-46. They are demoted to GENERIC in FetchMaterialID, because
# EncodePerFace keeps four bits and 48/49/50 would otherwise arrive in the
# fragment stage as GENERIC/LEAVES/GROUND_FOLIAGE. See THIN_FLAT in
# /environment/materialIDs.glsl.
#
# ⚠️ A block given an ID here MUST also be named in LightVolumeOpaque, or it
# becomes a wall: since batch 744 the fill fails closed. That is the one thing to
# check when adding to this list.
#
# Flat, a few centimetres thick, lying against a face.
block.10048=carpet \
	white_carpet orange_carpet magenta_carpet light_blue_carpet yellow_carpet \
	lime_carpet pink_carpet gray_carpet light_gray_carpet cyan_carpet \
