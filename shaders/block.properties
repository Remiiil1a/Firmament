# TODO: Support this in the shadowmap
#
# Soul campfires were here as well until batch 697. A block has one ID, and
# this one is a behavior number - it gives the block GLASS as its material
# nibble plus the diagonal selector - so a soul campfire listed here could not
# also be a light source. It moved to the soul family, block.10008. Nothing in
# the pack tests 10022 (its only mentions outside this file are two notes in
# /environment/materialIDs.glsl), so the selector the soul campfire loses with
# the move changes nothing that is implemented.
block.10022=campfire

# Light-emitting blocks, grouped by the color of the light they give off.
#
# The colors themselves are in /environment/lighting/light_colors.glsl, and the
# material IDs are in /environment/materialIDs.glsl.
#
# Since batch 696 this list is also the flood fill's emitter list: the shadow
# program looks a block up here and writes its color into the world image, and a
# block in no family is a wall to that fill. Blocks whose emission depends on a
# block state - a lit furnace, a shrieking sculk shrieker - can be listed safely
# for the fragment stage: whether a face glows at all is still decided by the
# light map, so an unlit one does not glow.
#
# Nothing here changes which blocks cast shadows, or anything else about how
# they are shaded. These IDs exist to give light sources a color.
block.10007=torch wall_torch lantern glowstone jack_o_lantern shroomlight \
	furnace blast_furnace smoker
block.10008=soul_torch soul_wall_torch soul_lantern soul_fire soul_campfire
# Soul campfires were in block.10022 until batch 697, which is a behavior
