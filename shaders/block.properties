# Blocks that do not cast shadows
# Transparent glass shadows are really ugly.
#
# TODO: For consistency this should apply to the glass casing of the beacon, but we cannot
#       easily detect that without specialized hardcoding in the shader code.
block.10006=glass glass_pane fire

# Stained glass and its panes, plus tinted glass.
#
# A material of its own rather than part of the glass above, because the colour
# of the light that has come through stained glass is what stained glass is for,
# and that colour is a colour this pack has to be able to look up by material.
# It is not grouped with the blocks above because those are the ones that cast
# nothing at all; see COLORED_SHADOWS in /environment/materialIDs.glsl for what
# this material does with the light instead.
block.10015=white_stained_glass orange_stained_glass magenta_stained_glass \
	light_blue_stained_glass yellow_stained_glass lime_stained_glass \
	pink_stained_glass gray_stained_glass light_gray_stained_glass \
