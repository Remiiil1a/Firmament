# Modified 2026-09-13 by Remiiil1a for Firmament - v0.1 (edit of coderbot's Steadfast).

# Disabled by default on Iris, but let's just be certain. We do our own
# directional lighting and have no need for Minecraft's directional lighting.
oldLighting=false

# Vanilla draws a water texture over the screen, which is super ugly with
# shaders. Disable it.
underwaterOverlay=false

# Disable programs when we don't have the corresponding effect, saves a bit of
# performance.
program.composite.enabled=GODRAYS

# The light bleed is the only reason the terrain shaders write colortex6, so
# turning off colored lights skips both the pass and the reason for the buffer.
#
# The indirect bounce lives in the same pass - it is the same gather over the
# same disk, asking the frame instead of the lamp mask - so the pass has to run
# while either of them wants it. Turning both off skips it, which is the only
# way to get that pass's cost back.
program.composite2.enabled=COLORED_LIGHTS || INDIRECT_BOUNCE

# The environment reflection has a pass of its own, one after composite1, so that
# it can trace over the resolved image composite1 writes. That pass does nothing
# else, so it is skipped whole when nothing is reflecting - the reflection is the
# only reason it exists.
program.composite3.enabled=PBR_REFLECTIONS || PBR_SSR

# SMAA is three passes and they are only ever all on or all off: the first finds
# the edges, the second works out how far each one runs and what the table says to
# do about it, and the third does the blending. Any one of them without the other
# two produces something worse than no anti-aliasing at all - skipping the first
# leaves the second reading a buffer nothing wrote, skipping the third leaves the
# edges found and nothing done about them - so they share one condition rather
# than having three of their own. See composite4.fsh.
program.composite4.enabled=SMAA
program.composite5.enabled=SMAA
program.composite6.enabled=SMAA

# The four passes that build the bloom, skipped whole when it is off. The first
# leaves the tight level of the glow in colortex12, and the last leaves the wide
# one in colortex13 - both of which final.fsh reads, so nothing else has to run
# for the effect to disappear cleanly. See lib/bloom.glsl.
program.composite7.enabled=BLOOM
program.composite8.enabled=BLOOM
program.composite9.enabled=BLOOM
program.composite10.enabled=BLOOM

# SMAA's two lookup tables, which are images in the pack rather than anything
# computed: how much to blend for each of the sixteen shapes an edge can make, and
# how far past a run of pixels an edge continues.
#
# The directive is customTexture and not texture, and that is the difference
# between this working and doing nothing at all.
#
# texture.<stage>.<name> is the older form and it names a *stage*, not a pass:
# its stage list is setup, begin, shadowcomp, prepare, gbuffers, deferred and
# composite, and there is no composite5 among them. What this said first was
# texture.composite5.smaaArea, which names a stage that does not exist, and Iris
# does not complain about one - the line is ignored, the sampler is left with
# nothing bound to it, an unbound image reads as zero, a blend weight of zero is
# no blend, and the whole feature does nothing while every option for it looks
# perfectly healthy. That is what "I turned it on and I cannot tell it apart from
# off, at any threshold" was.
#
# customTexture.<name> creates a sampler of a name of our choosing instead, and it
# belongs to no stage, so there is nothing to get wrong about which pass reads it.
# It is an Iris directive; this pack is Iris-only already, for the Voxy support and
# for RENDERTARGETS. Sundial-Lite uses the same form for its transmittance table.
#
# The paths are relative to this folder and carry no leading slash, which is what
# both the Iris documentation and the one working example in this workspace do.
customTexture.smaaArea = img/smaaArea.png
customTexture.smaaSearch = img/smaaSearch.png

# The sun and the moon, as the game itself draws them.
#
# A shader pack can only read images it carries, so the game's own sun.png and
# the eight moon phases were copied into this pack's img folder and are bound
# here. environment/sky/bodies.glsl samples them for the reflections.
#
# The moon is the eight phases laid out in a single row, in the game's own
# MoonPhase order, because this version of the game keeps them as eight separate
# files rather than as one sheet the way it used to. The row is indexed by
# worldDay % 8.
#
# Each of the two has an .mcmeta beside it that turns mipmapping off and clamping
# on. Blur is not wanted on either - the sun is 64 lit pixels out of 1024 - and
# blur plus wrapping would let the eight phases bleed into each other along the
# row.
customTexture.sunTex = img/sun.png
customTexture.moonPhasesTex = img/moonPhases.png

# Iris 1.5 does not support this more complex condition, but as it is an
# optimization, it does not matter.
#
# The ambient occlusion is in here for the reason the note on it in the pack
# gives: it has to run before composite1 resolves the frame over time, and this is
# the pass that does. Without the option in this list, turning on the occlusion
# and nothing else would leave this pass skipped and the option doing nothing.
program.deferred.enabled=SCREENSPACE_REFLECTIONS || SCREENSPACE_REFRACTION || WATER_ABSORPTION_METHOD == REFRACTION_ASSISTED || PBR_REFLECTIONS || PBR_SSR || VOLUMETRIC_CLOUDS || SCREENSPACE_SHADOWS || AMBIENT_OCCLUSION

#ifndef REAL_TIME_ENTITY_SHADOWS
	shadowEntities=false

	# Still cast shadows from the player
	shadowPlayer=true
#endif

#ifndef REAL_TIME_BLOCK_ENTITY_SHADOWS
	# Note: Block entities do not seem to respect the reduced entity render
	# distance, so therefore they can be very costly.
	shadowBlockEntities=false
#endif

#if PLANAR_CLOUD_LAYERS
	# Disable the vanilla cloud geometry when the planar layers are on, so that
	# the two do not end up drawn in the same place. Written without a comparison
	# because the number itself is the test: zero is off and anything else is on.
	clouds=off
#endif

#ifdef VOLUMETRIC_CLOUDS
	# The cloud layer this pack draws itself replaces the vanilla cloud geometry
	# outright - see /environment/clouds/volumetric.glsl. With both on, the two
	# would be drawn in the same place and the vanilla one would end up on top of
	# the other, since it is geometry and this is not.
	clouds=off
#endif

# Allows drawing translucent entities (like slimes) after the deferred pass runs,
# so that the background they blend against has fog properly applied.
separateEntityDraws=false

# The volumetric fog's buffer, at a quarter of the frame.
#
# It used to be the screen-space godrays' at half resolution. b314 replaced that
# pass with a march through the medium, and b315 took the target down to a
# quarter: the result is a wide smooth glow with no edges of its own, so
# upscaling costs nothing to look at, and the smaller target both pays for the
# higher step count and smooths what the dither leaves behind - which matters
# because this pack has no temporal filter left to do it.
#
# The same scale is written into /program/post/volumetric_fog.fsh by hand,
# because viewWidth is the size of the frame and not of this target. Changing
# one without the other moves the whole effect across the screen.
#
# VOLUMETRIC_FOG_FULL_RES switches both at once. It is a compile-time option, so
# the menu reloads the shaders when it is changed - and it costs sixteen times
# what the quarter-resolution version does, which is the whole reason it is off.
#ifdef VOLUMETRIC_FOG_FULL_RES
	size.buffer.colortex1=1.0 1.0
#else
	size.buffer.colortex1=0.25 0.25
#endif

# The bloom's buffers, at the two scales its blur works at: colortex12 is the
# tight level at half resolution, colortex13 is the wide one at a quarter, and
# colortex14 is the second quarter-resolution buffer the two blur passes need
# between them - a pass cannot read and write the same buffer at once. The
# scales are what keep the effect cheap: a pass at half resolution touches a
# quarter of the pixels, and one at a quarter resolution a sixteenth.
size.buffer.colortex12=0.5 0.5
size.buffer.colortex13=0.25 0.25
size.buffer.colortex14=0.25 0.25

# colortex3 holds the temporal anti-aliasing history, so it must not be cleared
# between frames - if it were, each frame would only ever be averaged with black
# and the anti-aliasing would do nothing at all.
colortex3Clear=false

# The hand's reflection in lit.fsh reads this buffer during the gbuffers stage,
# a frame before anything else does - see the note on colortex4Clear in
# program/post/copy_and_fog.fsh, which is where the flag is declared for the
# other loader.
colortex4Clear=false

# colortex9 holds the environment reflection as it has been resolved over time,
# so it must not be cleared between frames either - for the same reason as
# colortex3 above, and with the same consequence if it were: the reflection would
# only ever be averaged with black, and the resolving would do nothing.
#
# The format is declared with it, in composite3.fsh, which is the pass that
# writes it. RGBA16F rather than RGB: the alpha channel carries the distance the
# reflection was computed at, which is what the next frame compares against to
# tell a surface it can keep the history from one that has moved into the way.
colortex9Clear=false

# The colour of the light that has come through stained glass, or of the glow of
# a nether portal, is carried in shadowcolor1. The value that buffer clears to is
# load-bearing rather than cosmetic: white is what "nothing coloured is in the
# way" means, so a texel no geometry covers has to come back white or the surface
# that samples it would have its sunlight multiplied by whatever happened to be
# left there.
#
# Iris clears the shadow color buffers to white on its own, which is the value
# this needs - the line is here so that the requirement is written down where it
# can be seen rather than inherited from a default nobody is looking at. White is
# also what every fragment writes, so between the two the buffer only ever holds
# a colour where a surface deliberately put one. See COLORED_SHADOWS in
# environment/materialIDs.glsl.
shadowcolor1Clear=true

#ifdef FANCY_TRANSLUCENTS
	# Colors: Premultiplied alpha blending mode
	# Alpha: Do not change the color
	blend.gbuffers_water=ONE ONE_MINUS_SRC_ALPHA ZERO ONE
	blend.dh_water=ONE ONE_MINUS_SRC_ALPHA ZERO ONE

	# Because of our modified blending mode, alpha tests on the fragment output
	# are not valid. Because Minecraft 1.21.11+ uses cutout on the translucent
	# terrain pass for tripwire, we hardcode the alphaTestRef separately for it.
	alphaTest.gbuffers_water=off
	alphaTest.dh_water=off
#endif

# This unconditionally excludes Distant Horizons terrain from the shadow pass.
# Including distant terrain in the shadow pass does not work well with our
# single shadow map cascade, and both rendering distant terrain into the shadow
# map and sampling the shadow map while rendering distant terrain are extremely
# expensive.
#
# Our fallback lightmap shadows look better at this distance, and a better
# approach is screen-space shadows or any other non-shadowmap rendering method.
dhShadow.enabled=false
