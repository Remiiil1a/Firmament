# environment/lighting/diffuse.glsl, and the lang files give it the name this
# screen is titled with.
screen=FIRMAMENT <profile> [EFFECTS] [WATER] [ATMOSPHERE_CLOUDS] [LIGHTING] [PBR] [DEVELOPMENT] [ABOUT]

# Effects and post-processing, split into the four kinds of thing that live
# there: what the light does, what the camera does, what the colour does, and the
# temporal anti-aliasing, which gets a page of its own because it has settings of
# its own rather than because it is special - see the note on TAA in lib/taa.glsl.
screen.EFFECTS=[EFFECTS_CAMERA] [EFFECTS_COLOR] [EFFECTS_TAA] [EFFECTS_BLOOM] [EFFECTS_LIGHT] [SELECTION_SETTINGS]
screen.SELECTION_SETTINGS=SELECTION_BOX SELECTION_GLOW_R SELECTION_GLOW_G SELECTION_GLOW_B SELECTION_RGB_SPEED
screen.EFFECTS_CAMERA=MOTION_BLUR MOTION_BLUR_AMOUNT MOTION_BLUR_SAMPLES MOTION_BLUR_LENS VIGNETTE VIGNETTE_STRENGTH VIGNETTE_START VIGNETTE_END
screen.EFFECTS_COLOR=TONEMAP SATURATED_TONEMAP NIGHT_DESATURATION_EFFECT SKY_DITHER
# The page is about anti-aliasing, not about the temporal resolve specifically:
# SMAA is the other way to do the same job, and it is the one to reach for when
# the temporal resolve is being left off - whether because its ghosting reads
# worse than the aliasing it removes, or because something is being traced back
# through it. The two are alternatives, not a pair; see lib/smaa.glsl.
# The anti-aliasing page. It holds SMAA and nothing else: the temporal resolve it
# used to share the page with is off by default and lives under Development as
# experimental - see TAA in lib/taa.glsl for why, which is a black blot that has
# been reported and reproduced and never explained.
screen.EFFECTS_TAA=SMAA SMAA_THRESHOLD SMAA_SEARCH_DISTANCE
# The bloom gets a page of its own for the reason the anti-aliasing does: three
# settings that only mean anything together, and a player who has turned the
# effect off has no use for any of them. See lib/bloom.glsl.
screen.EFFECTS_BLOOM=BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS BLOOM_EXCLUDE_SPECULAR
# The enchant glint options live here rather than under the material pages,
# because the glint is not a material: it is an unlit layer drawn over an
# enchanted item by its own program, and it is the one effect in the pack that
# belongs to the enchantment rather than to the surface. See
# gbuffers_armor_glint.fsh, which is the only file involved.
screen.EFFECTS_LIGHT=UNDERWATER_GODRAYS UNDERWATER_GODRAYS_STRENGTH GLINT_BRIGHTNESS
screen.ATMOSPHERE_CLOUDS=[ATMOSPHERE_SKY] [ATMOSPHERE_FOG] [ATMOSPHERE_VOLUMETRIC_FOG] [WEATHER_SETTINGS] [CLOUDS] [END]
# The volumetric fog, which used to sit under Effects. It belongs here: it is the
# air the world is standing in, and every other thing on this page shapes the sky
# it is lit by. Two pages rather than one because there are sixteen options and a
# page that long is the thing PBR_PORTING.md 152 was about.
screen.ATMOSPHERE_VOLUMETRIC_FOG=[FOG_SETTINGS] [FOG_SHAPE_SETTINGS]
screen.FOG_SETTINGS=GODRAYS GODRAYS_STRENGTH VOLUMETRIC_FOG_DENSITY VOLUMETRIC_FOG_HEIGHT VOLUMETRIC_FOG_BASE VOLUMETRIC_FOG_DISTANCE VOLUMETRIC_FOG_STEPS VOLUMETRIC_FOG_FULL_RES UNDERWATER_GODRAYS UNDERWATER_GODRAYS_STRENGTH NETHER_PLUMES NETHER_PLUME_DENSITY NETHER_CEILING_SMOKE
screen.FOG_SHAPE_SETTINGS=VOLUMETRIC_FOG_NOISE VOLUMETRIC_FOG_SCALE VOLUMETRIC_FOG_OCTAVES VOLUMETRIC_FOG_OCTAVE_SCALE VOLUMETRIC_FOG_OCTAVE_FADE VOLUMETRIC_FOG_TIME_VARIATION VOLUMETRIC_FOG_RAIN_STRENGTH
screen.WEATHER_SETTINGS=RAIN_DROP_AMOUNT RAIN_DROP_SIZE RAIN_COLOR_SATURATION
screen.ATMOSPHERE_SKY=ATMOSPHERE_MODEL DAY_ATMOSPHERE NIGHT_ATMOSPHERE HARDER_HORIZON_DAY HARDER_HORIZON_NIGHT [STAR_SETTINGS]
screen.STAR_SETTINGS=STARS STAR_BRIGHTNESS STAR_CELLS STAR_DENSITY STAR_RADIUS
screen.ATMOSPHERE_FOG=BORDER_FOG ATMOSPHERE_FOG_STRENGTH_NOON
# The cloud page was one list of fourteen. Ten of those only mean anything while
# volumetric clouds are on, and three are the scattering a cloud does to its own
# light rather than a property of the layer; three shorter lists say which is
# which without a reader having to work it out from the option names.
screen.CLOUDS=[CLOUD_BASIC_SETTINGS] [CLOUD_VOLUMETRIC_SETTINGS] [CLOUD_SCATTER_SETTINGS]
screen.CLOUD_BASIC_SETTINGS=PLANAR_CLOUD_LAYERS VOLUMETRIC_CLOUDS CLOUD_PHASE_FLAT CLOUD_TRANSMITTANCE_FLAT CLOUD_LAYER_FALLOFF_BASE
screen.CLOUD_VOLUMETRIC_SETTINGS=VOLUMETRIC_CLOUD_CELL_SIZE VOLUMETRIC_CLOUD_COVERAGE VOLUMETRIC_CLOUD_HEIGHT VOLUMETRIC_CLOUD_THICKNESS VOLUMETRIC_CLOUD_SPEED VOLUMETRIC_CLOUD_STEPS
screen.CLOUD_SCATTER_SETTINGS=CLOUD_MULTIPLE_SCATTER CLOUD_MULTIPLE_SCATTER_OCTAVES CLOUD_MULTIPLE_SCATTER_FALLOFF
screen.END=END_SKY [END_BODY_SETTINGS] END_STAR_DENSITY END_STAR_BRIGHTNESS END_STAR_SIZE END_STAR_TINT END_AMBIENT
screen.END_BODY_SETTINGS=END_GIANT END_GIANT_SIZE END_GIANT_GLOW END_GIANT_CORE END_GIANT_TINT END_GIANT_LENS END_GIANT_LENS_RING END_GIANT_HALO END_GIANT_NEBULA END_GIANT_MOTION END_GIANT_MOTION_SPEED
screen.WATER=[WATER_STYLE] [WATER_EFFECTS] [WATER_COLOUR]
screen.WATER_STYLE=FANCY_TRANSLUCENTS VANILLA_ISH_WATER WATER_SURFACE WATER_AA
# The fourteen water options were one list, and they answer two unrelated
# questions: what shape the surface has, and what it does with the light that
# reaches it. The second is also where the water reflection's strength lives,
# which is the option a user complaining that water looks like a mirror goes
# looking for - and it was previously three quarters of the way down a list
# ordered by nothing in particular.
screen.WATER_EFFECTS=[WATER_SHAPE_SETTINGS] [WATER_OPTICS_SETTINGS]
screen.WATER_SHAPE_SETTINGS=WATER_PARALLAX WATER_PARALLAX_DISTANCE NUM_CRESTS NUM_RIPPLES WATER_CAUSTICS WATER_CAUSTICS_DISTANCE NUM_CAUSTICS WATER_BODY_SIZE WATER_SUN_SIZE WATER_MOON_SIZE WATER_BODY_TILT WATER_BODY_BRIGHTNESS
screen.WATER_OPTICS_SETTINGS=SCREENSPACE_REFRACTION SCREENSPACE_REFLECTIONS WATER_REFLECTION_STRENGTH GLASS_REFLECTIONS WATER_SKY_BODIES
screen.WATER_COLOUR=WATER_CHARACTER WATER_ABSORPTION_METHOD DARK_UNDERWATER
screen.LIGHTING=[LIGHTING_SKY] [LIGHTING_BLOCK] [SHADOWS]
screen.LIGHTING_SKY=DAY_SKY_LIGHTING NIGHT_SKY_LIGHTING MINISHITA_LIGHTING DIRECTIONAL_SKYLIGHT_SHADING MIN_AMBIENT_BRIGHTNESS
screen.LIGHTING_BLOCK=HELD_BLOCK_LIGHTING BLOCKLIGHT_STRENGTH BLOCKLIGHT_TEMPERATURE COLORED_LIGHTS COLORED_LIGHTS_STRENGTH LIGHT_TINT_STRENGTH LIGHT_BLEED_STRENGTH LIGHT_BLEED_RADIUS LIGHT_BLEED_DEPTH INDIRECT_BOUNCE INDIRECT_BOUNCE_STRENGTH INDIRECT_BOUNCE_FLOOR
# The shadows page was one list of twenty-one holding three different things: the
# shadow map the game draws, the screen-space shadows this pack adds past the end
# of it, and the ambient occlusion. They are three stages of the same idea rather
# than one page's worth of settings, and they are turned on and off separately.
screen.SHADOWS=[SHADOW_SETTINGS] [SSS_SETTINGS] [AO_SETTINGS]
screen.SHADOW_SETTINGS=REAL_TIME_SHADOWS REAL_TIME_ENTITY_SHADOWS REAL_TIME_BLOCK_ENTITY_SHADOWS COLORED_SHADOWS COLORED_SHADOWS_STRENGTH COLORED_SHADOWS_PORTAL shadowMapResolution shadowDistance SHADOW_SOFTNESS SOFTER_SHADOWS SHADOW_DISTORT_FACTOR
screen.SSS_SETTINGS=SCREENSPACE_SHADOWS SSS_STRENGTH SSS_DARK_LIMIT SSS_GAIN SSS_STEPS SSS_LENGTH
screen.AO_SETTINGS=AMBIENT_OCCLUSION AO_STRENGTH AO_RADIUS AO_SAMPLES
# The material options. The root keeps the format switch, which decides whether
# any of this applies at all, and then there is one page per question rather than
# two long lists: this was a list of nineteen and a list of twenty-one, and
# neither said what was in it.
#
# The pages are the order the questions come in when something looks wrong: is the
# surface being read at all (the maps), is its shape being faked (parallax), what
# does the surface itself do with the light (its response), and then the four
# answers a surface can give - the specular highlight, being a metal, emitting,
# and reflecting the world - each on its own page, because those four are what a
# user comes here looking for by name.
#
# This is not a hierarchy for its own sake. The metal page holds three options,
# and it exists because a reader looking for the metal option could not find it
# among twenty-one others that had nothing to do with it. See PBR_PORTING.md 152.
screen.PBR=PBR_FORMAT [PBR_NORMAL_SETTINGS] [PBR_PARALLAX_SETTINGS] [PBR_SURFACE_SETTINGS] [PBR_SPECULAR_SETTINGS] [PBR_METAL_SETTINGS] [PBR_EMISSION_SETTINGS] [PBR_REFLECTION_SETTINGS] [PBR_COVERAGE]
screen.PBR_NORMAL_SETTINGS=PBR_TANGENT_ATTRIBUTE PBR_NORMAL_MAP PBR_NORMAL_STRENGTH PBR_MATERIAL_MAX_LOD PBR_NORMAL_FADE_LOD
screen.PBR_PARALLAX_SETTINGS=PBR_PARALLAX PBR_PARALLAX_STEPS PBR_PARALLAX_REFINE PBR_PARALLAX_SMOOTH PBR_PARALLAX_DEPTH PBR_PARALLAX_MAX_OFFSET PBR_PARALLAX_DISTANCE PBR_PARALLAX_SHADOW PBR_PARALLAX_SHADOW_STRENGTH
screen.PBR_SURFACE_SETTINGS=PBR_MATERIAL_AO PBR_MATERIAL_AO_STRENGTH PBR_SUBSURFACE PBR_SSS_STRENGTH PBR_POROSITY_WETNESS PBR_DEFAULT_MATERIAL PBR_DEFAULT_ROUGHNESS
screen.PBR_SPECULAR_SETTINGS=PBR_SPECULAR PBR_SPECULAR_STRENGTH PBR_LIGHT_SIZE PBR_ENERGY_CONSERVATION
screen.PBR_METAL_SETTINGS=PBR_METALS PBR_METAL_DIFFUSE PBR_METAL_REFLECTION_STRENGTH
screen.PBR_EMISSION_SETTINGS=PBR_EMISSION PBR_EMISSION_ANY_BLOCK PBR_EMISSION_STRENGTH BLOCK_EMISSION BLOCK_EMISSION_STRENGTH
screen.PBR_REFLECTION_SETTINGS=PBR_REFLECTIONS PBR_REFLECTIONS_STRENGTH PBR_REFLECTIONS_ROUGHNESS PBR_REFLECTION_SKY_MIN PBR_REFLECTION_SMOOTHNESS_MIN PBR_REFLECTION_BLUR PBR_SSR PBR_SSR_STEPS
screen.PBR_COVERAGE=PBR_TRANSLUCENT PBR_HAND_ITEMS PBR_HAND_ITEM_MATERIALS PBR_ENTITIES
screen.DEVELOPMENT=[DEBUG_VIEWS] [DEV_TOOLS] [EXPERIMENTAL_TAA]
screen.EXPERIMENTAL_TAA=TAA TAA_STRENGTH TAA_JITTER TAA_CLAMP TAA_DARK_FLOOR TAA_SHARPEN
screen.DEBUG_VIEWS=SURFACE_COLORS PBR_DEBUG CLOUD_DEBUG END_DEBUG TAA_DEBUG DEFERRED_DEBUG AO_DEBUG SMAA_DEBUG
screen.DEV_TOOLS=DEBUG FREEZE_ANIMATION_TIMER PREFER_FDM_GRADIENT *

# Credits. These three are authorship options rather than settings - they are
# defined so that the names appear in the menu, and the tooltips behind them
# carry the licence text. See NOTICE.md next to the README.
screen.ABOUT=FIRMAMENT STEADFAST [SPECIAL_THANKS]

# The other shaders this pack references or quotes code from, one entry each
# rather than one entry for all of them: written out in full in a single entry
# they ran together into a wall of text.
screen.SPECIAL_THANKS=THANKS_MELLOW THANKS_SUNDIAL


