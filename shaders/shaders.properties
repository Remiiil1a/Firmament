# TODO: Stylistic review needed
# TODO: Currently these uncategorized uniforms do not have any isolation and can 
#       reference any other uniform or variable. It should be refactored into
#       modules.

# Required for #if statements to work.
#define FANTASY 0
#define SEMI_NATURAL 1
#define RETRO 2

### CUSTOM UNIFORMS: Sky lighting

#if DAY_SKY_LIGHTING == SEMI_NATURAL
	# This sunProgress curve rapidly rises to 1.0 resulting in fairly short yet
	# fairly intense sunrises that quickly transition into broad daylight.
	#
	# The division by 0.75 is to account for the 40 degree sun angle meaning that
	# worldSunVector.y never actually gets to 1.0.
	uniform.float.sunProgress=1.0 - pow(1.0 - clamp(worldSunVector.y / 0.75, 0.0, 1.0), 2)

	variable.vec3.sunlightBase = vec3( \
		4.0 * (0.40 + 0.60 * sunProgress), \
		4.0 * (0.08 + 0.04 * sunProgress + 0.88 * sunProgress * sunProgress), \
		4.0 * (0.00 + 0.95 * pow(0.1 + 0.9 * sunProgress, 3.0)))

	variable.float.sunlightLumaRain=0.05
	variable.float.sunlightBounce=mix(0.05, 0.10, sunProgress)

	# Similarly to how sunlight suppresses block light, make sunlight also suppress up to
	# 80% of the ambient light, peaking at noon.
	#
	# This is because our light colors are tuned for an environment with no autoexposure
	# and are not physically-based. As a result, while in real life sunlight is a lot
	# brighter than the ambient lighting, in Steadfast ambient light and sunlight actually
	# have comparable intensities. To avoid making sunlight appear to have a blue tint,
	# as a result, we must suppress ambient lighting when sunlight is shining.
	#
	# NOTE: Since this works by subtracting ambient light from sunlight, be careful that
	#       this does not go negative. Also note that water caustics can cause direct light
	#       to be up to 2.5x its normal value!
	variable.float.sunlightSuppressesAmbient=0.8 * sunProgress * (1.0 - rainStrength)

	# TODO: Very blue ambient option:
	# variable.float.sunlightBounce=mix(0.025, 0.05, sunProgress)
#elif DAY_SKY_LIGHTING == FANTASY
	# Calculate sun progression based on the sine of the angle of the sun with the horizon
	# When the sun is at the horizon, the progress is 0.0, when it is at the top, the progress
	# is 1.0.
	#
	# Of course, with a 40 degree sun path rotation, it never actually reaches the top. But 
	# that is OK for us.
	variable.float.sunProgress=pow(clamp(worldSunVector.y, 0.0, 1.0), 2)

	variable.float.riseB=1.75 * sunProgress * sunProgress
	variable.float.maxB=0.32 + 0.05 * sunProgress
	variable.float.greenV=if(sunProgress > 0.5, 0.375, (-1.5 * sunProgress * sunProgress) + (1.5 * sunProgress))

	# Red:   Constant
	# Green: Simple quadratic but cap out at 0.5
	# Blue:  Rapid rise with a slowly-rising ceiling
	variable.vec3.sunlightBase=vec3( \
		8.0 * 0.6, \
		8.0 * (0.125 + greenV), \
		8.0 * (0.005 + min(riseB, maxB)) \
	)

	variable.float.sunlightLumaRain=0.08
	variable.float.sunlightBounce=0.125
	variable.float.sunlightSuppressesAmbient=0.0
#else
	# The division by 0.75 is to account for the 40 degree sun angle meaning that
	# worldSunVector.y never actually gets to 1.0.
	variable.float.sunProgress=clamp(worldSunVector.y / 0.75, 0.0, 1.0)

	variable.vec3.sunlightBase=vec3( \
		3.3 * mix(0.75, 1.00, sunProgress), \
		3.3 * mix(0.55, 0.88, sunProgress), \
		3.3 * mix(0.10, 0.75, sunProgress))

	variable.float.sunlightLumaRain=0.0
	variable.float.sunlightBounce=0.1
	variable.float.sunlightSuppressesAmbient=0.0
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.sunlightLuma=0.299 * sunlightBase.r + 0.587 * sunlightBase.g + 0.114 * sunlightBase.b

uniform.vec3.sunlightColor=vec3( \
	mix(sunlightBase.r, sunlightLuma * sunlightLumaRain, rainStrength), \
	mix(sunlightBase.g, sunlightLuma * sunlightLumaRain, rainStrength), \
	mix(sunlightBase.b, sunlightLuma * sunlightLumaRain, rainStrength))

#if NIGHT_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.moonlightBase=vec3( \
		0.16 * 0.5, \
		0.16 * 0.5, \
		0.16 * 1.0 \
	)

	variable.float.moonlightLumaRain=0.25
#elif NIGHT_SKY_LIGHTING == FANTASY
	variable.vec3.moonlightBase=vec3( \
		0.16 * 0.35, \
		0.16 * 0.65, \
		0.16 * 1.00 \
	)

	variable.float.moonlightLumaRain=0.5
#else
	variable.vec3.moonlightBase=vec3( \
		0.33 * 0.35, \
		0.33 * 0.65, \
		0.33 * 1.00 \
	)

	variable.float.moonlightLumaRain=0.0
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.moonlightLuma=0.299 * moonlightBase.r + 0.587 * moonlightBase.g + 0.114 * moonlightBase.b
uniform.vec3.moonlightColor=vec3( \
	mix(moonlightBase.r, moonlightLuma * moonlightLumaRain, rainStrength), \
	mix(moonlightBase.g, moonlightLuma * moonlightLumaRain, rainStrength), \
	mix(moonlightBase.b, moonlightLuma * moonlightLumaRain, rainStrength))

# To avoid a sudden jolt between the sun casting shadows and the moon casting shadows,
# we have a very brief (only a few seconds) fade to no diffuse lighting when switching
# the shadow light source.
#
# This value is 1.0 most of the time, but very rapidly falls to 0.0 and rises back to 1.0
# as the sun/moon approach the horizon.
variable.float.lightTransitionFade=pow(min(1.0, 66.0 * abs(worldSunVector.y)), 2.0)

#ifdef MINISHITA_LIGHTING
	uniform.vec3.directLightSurface=directLightSurfaceMinishita
#else
	# Pick the right light source depending on whether the sun or moon is currently casting
	# shadows, and fade to dark during the transition between the sun and moon.
	#
	# This is equivalent to: if(worldSunVector.y > 0.0, sunlightColor, moonlightColor) * lightTransitionFade
	#
	# This variant is the direct light color applied to the world surface above-water.
	uniform.vec3.directLightSurface=vec3( \
		if(worldSunVector.y > 0.0, sunlightColor.r * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.r, moonlightColor.r) * lightTransitionFade, \
		if(worldSunVector.y > 0.0, sunlightColor.g * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.g, moonlightColor.g) * lightTransitionFade, \
		if(worldSunVector.y > 0.0, sunlightColor.b * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.b, moonlightColor.b) * lightTransitionFade \
	)
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.directLightLuma=0.299 * directLightSurface.r + 0.587 * directLightSurface.g + 0.114 * directLightSurface.b

# The underwater direct light color is faded slightly with the luma to lighten up some of the
# yellows during sunrise to avoid a weird green tint with water absorption.
uniform.vec3.directLightUnderwater=vec3( \
	mix(directLightSurface.r, directLightLuma, 0.5), \
	mix(directLightSurface.g, directLightLuma, 0.5), \
	mix(directLightSurface.b, directLightLuma, 0.5) \
)

uniform.float.causticsFade=1.0 - rainStrength

