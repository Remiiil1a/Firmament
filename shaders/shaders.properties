# The default configuration of this edit, listed first so that there is always
# a way back to it: Steadfast's own built-in look (the values its source ships
# with, before any style profile is picked) together with the material options
# this edit adds, at the values they are tuned to.
#
# Nothing here is a new style. The colour grading, the atmosphere model, the
# tonemap and the sky are all restated at Steadfast's defaults, which is the
# point - picking a style profile below changes them, and picking this one puts
# them back.
profile.EDIT_DEFAULT= \
	ATMOSPHERE_MODEL:MINISHITA TONEMAP:TONEMAP_UNCHARTED2 \
	!SATURATED_TONEMAP \
	DAY_ATMOSPHERE:SEMI_NATURAL NIGHT_ATMOSPHERE:FANTASY \
	DAY_SKY_LIGHTING:RETRO NIGHT_SKY_LIGHTING:FANTASY \
	HARDER_HORIZON_DAY !HARDER_HORIZON_NIGHT \
	NIGHT_DESATURATION_EFFECT \
	GODRAYS GODRAYS_STRENGTH:2.0 UNDERWATER_GODRAYS UNDERWATER_GODRAYS_STRENGTH:1.5 BORDER_FOG ATMOSPHERE_FOG_STRENGTH_NOON:0.5 \
	NETHER_PLUMES NETHER_PLUME_DENSITY:1.5 NETHER_CEILING_SMOKE:1.0 \
	SELECTION_BOX:SELECTION_BOX_VANILLA SELECTION_GLOW_R:255 SELECTION_GLOW_G:255 SELECTION_GLOW_B:255 SELECTION_RGB_SPEED:1.0 \
	PLANAR_CLOUD_LAYERS:0 \
	VOLUMETRIC_CLOUDS VOLUMETRIC_CLOUD_CELL_SIZE:24 \
	VOLUMETRIC_CLOUD_COVERAGE:0.5 \
	VOLUMETRIC_CLOUD_HEIGHT:192 VOLUMETRIC_CLOUD_THICKNESS:12 \
	VOLUMETRIC_CLOUD_SPEED:0.5 VOLUMETRIC_CLOUD_STEPS:12 \
	\
	FANCY_TRANSLUCENTS !VANILLA_ISH_WATER \
	WATER_SURFACE:NOISE WATER_AA:BALANCED \
	WATER_ABSORPTION_METHOD:REFRACTION_ASSISTED \
	WATER_PARALLAX SCREENSPACE_REFRACTION SCREENSPACE_REFLECTIONS WATER_CAUSTICS \
	WATER_PARALLAX_DISTANCE:48.0 WATER_CAUSTICS_DISTANCE:48.0 \
	\
	COLORED_LIGHTS DIRECTIONAL_SKYLIGHT_SHADING HELD_BLOCK_LIGHTING \
	MINISHITA_LIGHTING MIN_AMBIENT_BRIGHTNESS:0.1 \
	shadowMapResolution:2048 shadowDistance:128 \
	REAL_TIME_SHADOWS REAL_TIME_ENTITY_SHADOWS !REAL_TIME_BLOCK_ENTITY_SHADOWS \
	!AMBIENT_OCCLUSION AO_STRENGTH:1.0 AO_RADIUS:1.5 AO_SAMPLES:24 !AO_DEBUG \
	SMAA SMAA_THRESHOLD:0.30 SMAA_SEARCH_DISTANCE:16 \
	BLOCKLIGHT_TEMPERATURE:6500 \
	WATER_REFLECTION_STRENGTH:1.0 \
	\
	END_SKY:END_SKY_AUTO \
	END_STAR_DENSITY:2.0 END_STAR_BRIGHTNESS:3.0 END_STAR_SIZE:2.0 \
	END_STAR_TINT:1.0 \
	END_AMBIENT:1.0 \
	END_GIANT END_GIANT_SIZE:0.13 END_GIANT_GLOW:1.0 END_GIANT_CORE:0.0 \
	END_GIANT_TINT:1.0 \
	END_GIANT_LENS:1.0 END_GIANT_LENS_RING:2.2 END_GIANT_HALO:0.10 \
	END_GIANT_NEBULA:0.22 \
	END_GIANT_MOTION END_GIANT_MOTION_SPEED:0.25 \
	!END_DEBUG \
	\
	PBR_FORMAT:LAB_PBR !PBR_REFLECTIONS PBR_REFLECTIONS_STRENGTH:0.25 \
	PBR_SSR PBR_SSR_STEPS:24 PBR_REFLECTION_BLUR:64.0 PBR_REFLECTION_SKY_MIN:0.9 \
	PBR_POROSITY_WETNESS PBR_TRANSLUCENT PBR_HAND_ITEMS PBR_ENTITIES \
	!PBR_PARALLAX

# WIP new visual style
profile.MINISHITA_HIGH= \
	\
	GODRAYS GODRAYS_STRENGTH:1.0 UNDERWATER_GODRAYS NIGHT_DESATURATION_EFFECT \
	\
	!VANILLA_ISH_WATER FANCY_TRANSLUCENTS WATER_ABSORPTION_METHOD:REFRACTION_ASSISTED \
	SCREENSPACE_REFRACTION SCREENSPACE_REFLECTIONS \
	WATER_SURFACE:NOISE \
	WATER_PARALLAX WATER_PARALLAX_DISTANCE:48.0 \
	WATER_CAUSTICS WATER_CAUSTICS_DISTANCE:48.0 \
	\
	shadowMapResolution:1536 \
	shadowDistance:160 \
	REAL_TIME_SHADOWS \
	REAL_TIME_ENTITY_SHADOWS \
	!REAL_TIME_BLOCK_ENTITY_SHADOWS \
	MINISHITA_LIGHTING \
	DIRECTIONAL_SKYLIGHT_SHADING \
	HELD_BLOCK_LIGHTING \
	\
	ATMOSPHERE_MODEL:MINISHITA TONEMAP:TONEMAP_UCHIMURA \
	\
	ATMOSPHERE_FOG_STRENGTH_NOON:0.5 BORDER_FOG \
	\
	PLANAR_CLOUD_LAYERS:0

profile.MINISHITA_MEDIUM=profile.MINISHITA_HIGH !GODRAYS !UNDERWATER_GODRAYS WATER_PARALLAX_DISTANCE:32.0 WATER_CAUSTICS_DISTANCE:32.0 shadowDistance:112
profile.MINISHITA_LOW=profile.MINISHITA_MEDIUM WATER_SURFACE:BASIC !WATER_CAUSTICS !SCREENSPACE_REFRACTION !SCREENSPACE_REFLECTIONS shadowMapResolution:1024 shadowDistance:80 !REAL_TIME_ENTITY_SHADOWS
profile.MINISHITA_TOASTER=profile.MINISHITA_LOW !REAL_TIME_SHADOWS

# The flagship profile of Steadfast. Colorful yet cozy, Paragon blends a variety of visual styles and is the very best that Steadfast has to offer.
profile.PARAGON_HIGH=profile.SEMI_NATURAL_HIGH NIGHT_SKY_LIGHTING:FANTASY NIGHT_ATMOSPHERE:FANTASY !HARDER_HORIZON_NIGHT !NIGHT_DESATURATION_EFFECT
profile.PARAGON_MEDIUM=profile.PARAGON_HIGH !GODRAYS !UNDERWATER_GODRAYS WATER_PARALLAX_DISTANCE:32.0 WATER_CAUSTICS_DISTANCE:32.0 shadowDistance:112
profile.PARAGON_LOW=profile.PARAGON_MEDIUM WATER_SURFACE:BASIC !WATER_CAUSTICS !SCREENSPACE_REFRACTION !SCREENSPACE_REFLECTIONS PLANAR_CLOUD_LAYERS:1 shadowMapResolution:1024 shadowDistance:80 !REAL_TIME_ENTITY_SHADOWS
profile.PARAGON_TOASTER=profile.PARAGON_LOW !REAL_TIME_SHADOWS

# Base Fantasy style.
profile.FANTASY_HIGH= \
	\
	GODRAYS GODRAYS_STRENGTH:1.0 UNDERWATER_GODRAYS !NIGHT_DESATURATION_EFFECT \
	\
	!VANILLA_ISH_WATER FANCY_TRANSLUCENTS WATER_ABSORPTION_METHOD:REFRACTION_ASSISTED \
	SCREENSPACE_REFRACTION SCREENSPACE_REFLECTIONS \
	WATER_SURFACE:NOISE \
	WATER_PARALLAX WATER_PARALLAX_DISTANCE:48.0 \
	WATER_CAUSTICS WATER_CAUSTICS_DISTANCE:48.0 \
	\
	shadowMapResolution:1536 \
	shadowDistance:160 \
	REAL_TIME_SHADOWS \
	REAL_TIME_ENTITY_SHADOWS \
	!REAL_TIME_BLOCK_ENTITY_SHADOWS \
	DAY_SKY_LIGHTING:FANTASY NIGHT_SKY_LIGHTING:FANTASY !MINISHITA_LIGHTING \
	DIRECTIONAL_SKYLIGHT_SHADING \
	HELD_BLOCK_LIGHTING \
	\
	DAY_ATMOSPHERE:FANTASY NIGHT_ATMOSPHERE:FANTASY \
	!HARDER_HORIZON_DAY !HARDER_HORIZON_NIGHT \
	ATMOSPHERE_MODEL:GRADIENT TONEMAP:TONEMAP_UNCHARTED2 \
	\
	ATMOSPHERE_FOG_STRENGTH_NOON:1.0 BORDER_FOG \
	\
	PLANAR_CLOUD_LAYERS:0

# In Fantasy, the godrays are somewhat more impactful to the appearance of the shader.
# The more basic water surface is actually mostly fine so we switch to that and turn off
# refraction to save a decent amount of performance hit.
profile.FANTASY_MEDIUM=profile.FANTASY_HIGH WATER_SURFACE:BASIC !WATER_CAUSTICS !SCREENSPACE_REFRACTION WATER_PARALLAX_DISTANCE:16.0 WATER_CAUSTICS_DISTANCE:24.0 shadowDistance:112

# Go to the lowest performance impact while still maintaining the basic lighting system
# with shadow mapping as well as a basic water surface.
profile.FANTASY_LOW=profile.FANTASY_MEDIUM !SCREENSPACE_REFLECTIONS !GODRAYS !UNDERWATER_GODRAYS shadowMapResolution:1024 shadowDistance:80 !REAL_TIME_ENTITY_SHADOWS

# Same as Low, but without any shadow mapping.
profile.FANTASY_TOASTER=profile.FANTASY_LOW !REAL_TIME_SHADOWS

# Base Semi-Natural style.
profile.SEMI_NATURAL_HIGH= \
	\
	GODRAYS GODRAYS_STRENGTH:1.0 UNDERWATER_GODRAYS NIGHT_DESATURATION_EFFECT \
	\
	!VANILLA_ISH_WATER FANCY_TRANSLUCENTS WATER_ABSORPTION_METHOD:REFRACTION_ASSISTED \
	SCREENSPACE_REFRACTION SCREENSPACE_REFLECTIONS \
	WATER_SURFACE:NOISE \
	WATER_PARALLAX WATER_PARALLAX_DISTANCE:48.0 \
	WATER_CAUSTICS WATER_CAUSTICS_DISTANCE:48.0 \
	\
	shadowMapResolution:1536 \
	shadowDistance:160 \
	REAL_TIME_SHADOWS \
	REAL_TIME_ENTITY_SHADOWS \
	!REAL_TIME_BLOCK_ENTITY_SHADOWS \
	DAY_SKY_LIGHTING:SEMI_NATURAL NIGHT_SKY_LIGHTING:SEMI_NATURA !MINISHITA_LIGHTING \
	DIRECTIONAL_SKYLIGHT_SHADING \
	HELD_BLOCK_LIGHTING \
	\
	DAY_ATMOSPHERE:SEMI_NATURAL NIGHT_ATMOSPHERE:SEMI_NATURAL \
	HARDER_HORIZON_DAY HARDER_HORIZON_NIGHT \
	ATMOSPHERE_MODEL:GRADIENT TONEMAP:TONEMAP_UNCHARTED2 \
	\
	ATMOSPHERE_FOG_STRENGTH_NOON:0.5 BORDER_FOG \
	\
	PLANAR_CLOUD_LAYERS:2 \
	!VOLUMETRIC_CLOUDS


# In Semi-Natural, the water appearance is extremely impactful to the overall appearance of the shader.
# Godrays are surprisingly expensive (being our only post-process effect right now...) so if we are
# willing to drop them, we can (for almost the same performance hit) keep the high-quality parallax
# water with refraction and reflections.
profile.SEMI_NATURAL_MEDIUM=profile.SEMI_NATURAL_HIGH !GODRAYS !UNDERWATER_GODRAYS WATER_PARALLAX_DISTANCE:32.0 WATER_CAUSTICS_DISTANCE:32.0 shadowDistance:112

# Go to the lowest performance impact while still maintaining the basic lighting system
# with shadow mapping as well as a basic water surface.
profile.SEMI_NATURAL_LOW=profile.SEMI_NATURAL_MEDIUM WATER_SURFACE:BASIC !WATER_CAUSTICS !SCREENSPACE_REFRACTION !SCREENSPACE_REFLECTIONS PLANAR_CLOUD_LAYERS:1 shadowMapResolution:1024 shadowDistance:80 !REAL_TIME_ENTITY_SHADOWS

# Same as Low, but without any shadow mapping.
profile.SEMI_NATURAL_TOASTER=profile.SEMI_NATURAL_LOW !REAL_TIME_SHADOWS

# Retro has a pretty low performance impact due to the vanilla water surface, but we still have two
# profiles just to disable godrays as essentially the only post process effect.
profile.RETRO_MEDIUM= \
	\
	GODRAYS GODRAYS_STRENGTH:1.0 UNDERWATER_GODRAYS !NIGHT_DESATURATION_EFFECT \
	\
	VANILLA_ISH_WATER !FANCY_TRANSLUCENTS WATER_ABSORPTION_METHOD:NO_ABSORPTION \
	!SCREENSPACE_REFRACTION !SCREENSPACE_REFLECTIONS \
	WATER_SURFACE:BASIC \
	!WATER_PARALLAX WATER_PARALLAX_DISTANCE:8.0 \
	!WATER_CAUSTICS \
	\
	shadowMapResolution:1536 \
	shadowDistance:112 \
	REAL_TIME_SHADOWS \
	REAL_TIME_ENTITY_SHADOWS \
	!REAL_TIME_BLOCK_ENTITY_SHADOWS \
	DAY_SKY_LIGHTING:RETRO NIGHT_SKY_LIGHTING:RETRO !MINISHITA_LIGHTING \
	!DIRECTIONAL_SKYLIGHT_SHADING \
	HELD_BLOCK_LIGHTING \
	\
	DAY_ATMOSPHERE:RETRO NIGHT_ATMOSPHERE:RETRO \
	!HARDER_HORIZON_DAY !HARDER_HORIZON_NIGHT \
	ATMOSPHERE_MODEL:GRADIENT TONEMAP:TONEMAP_UNCHARTED2 \
	\
	ATMOSPHERE_FOG_STRENGTH_NOON:1.0 BORDER_FOG \
	\
	PLANAR_CLOUD_LAYERS:0 \
	!VOLUMETRIC_CLOUDS

# As promised, disable the godrays on the lowest setting.
profile.RETRO_LOW=profile.RETRO_MEDIUM !GODRAYS !UNDERWATER_GODRAYS shadowMapResolution:1024 shadowDistance:80 !REAL_TIME_ENTITY_SHADOWS

