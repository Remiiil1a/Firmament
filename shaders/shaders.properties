# Effects and post-processing, split into the four kinds of thing that live
# there: what the light does, what the camera does, what the colour does, and the
# temporal anti-aliasing, which gets a page of its own because it has settings of
# its own rather than because it is special - see the note on TAA in lib/taa.glsl.
screen.EFFECTS=[EFFECTS_LIGHT] [EFFECTS_CAMERA] [EFFECTS_COLOR] [EFFECTS_TAA]
screen.EFFECTS_LIGHT=SCREENSPACE_SHADOWS SSS_STRENGTH SSS_STEPS SSS_LENGTH GODRAYS NIGHT_DESATURATION_EFFECT
screen.EFFECTS_CAMERA=MOTION_BLUR MOTION_BLUR_AMOUNT MOTION_BLUR_SAMPLES MOTION_BLUR_LENS
screen.EFFECTS_COLOR=SATURATED_TONEMAP
screen.EFFECTS_TAA=TAA TAA_STRENGTH TAA_JITTER TAA_CLAMP TAA_SHARPEN
screen.ATMOSPHERE_CLOUDS=DAY_ATMOSPHERE NIGHT_ATMOSPHERE HARDER_HORIZON_DAY HARDER_HORIZON_NIGHT BORDER_FOG ATMOSPHERE_FOG_STRENGTH_NOON PLANAR_CLOUD_LAYERS VOLUMETRIC_CLOUDS VOLUMETRIC_CLOUD_CELL_SIZE VOLUMETRIC_CLOUD_COVERAGE VOLUMETRIC_CLOUD_HEIGHT VOLUMETRIC_CLOUD_THICKNESS VOLUMETRIC_CLOUD_SPEED VOLUMETRIC_CLOUD_STEPS END_SKY END_BODY END_STAR_DENSITY END_STAR_BRIGHTNESS END_FOG HIDE_END_FLASH
