### CUSTOM UNIFORMS: World ambient / diffuse lighting

# During the day, suppress block light based on the ambient sky lighting. In other words,
# terrain completely exposed to the sky will essentially entirely suppress all block lighting.
#
# In real life, sunlight is significantly brighter than any other light source, and the
# eye adapts to this accordingly, such that other light sources have very little impact
# due to their low relative impact.
#
# Many shader packs simulate this in a literal sense by adding autoexposure and eye adaption effects.
# Even vanilla Minecraft simulates this in its lightmap by maxing out lighting and not adding
# in additional contribution from block light at 100% sky light.
#
# However, we have committed to not using eye adaption / autoexposure effects because they tend
# to be pretty obnoxious, and actually flat out wrong compared to how our quickly our eyes adapt
# to exposure differences. In addition, HDR means that Minecraft's method exploiting LDR color
# maxing out is not directly applicable.
#
# This mechanism is a very convincing way of making sunlight look far brighter than block lighting,
# without needing eye adaption effects and similar. By fading out blocklight in areas exposed to
# the sky during the day, we accomplish this same effect without all of the nasty side effects of
# the autoexposure / eye adaption approach.
#
# We fade in torches/etc slowly before it turns night rather than rapidly fading them in after
# it has already turned night, so that by the time the sun sets, all blocklight has completed
# fading in.
#
# Note: nightBlocklightFade is similar to nightAmbientFade but starts sooner and is more gradual.
variable.float.nightBlocklightFade=pow(clamp(1.0 - worldSunVector.y / 0.25, 0.0, 1.0), 4.0)
uniform.float.blocklightSuppression=(1.0 - nightBlocklightFade) * (1.0 - pow(rainStrength, 4.0))

# The color of block light used to be chosen here, from a list of candidates
# that reads as a list of everything the pack would have liked to do at once:
# orange for torches, blue-white for soul lanterns, purple for crying obsidian,
# red for redstone. Only one of them could ever be active, because this is one
# color for the whole world, and every light in it had to share.
#
# It is no longer a color the pack picks at all. Three things replace it:
#
#  * The lightmap supplies the color, sampled in BlockLightTint. A resource pack
#    can recolor its lightmap, which is how it says what color its lights are.
#  * BLOCKLIGHT_STRENGTH below sets how bright block light is, which is the part
#    the lightmap cannot answer because this model replaces its falloff.
#  * The lights themselves are colored per block, by the material IDs in
#    environment/materialIDs.glsl and the table in
#    environment/lighting/light_colors.glsl, and the color of the light sources
#    on screen is spread onto the surfaces around them by
#    program/post/light_bleed.fsh.
#
# So a soul lantern lights a wall blue and a redstone torch lights it red, at
# the same time, in the same room, which is what the list above was reaching
# for.

uniform.float.heldLightBaseStrength=pow(heldBlockLightValue / 15.0, 4)
uniform.float.heldLightSuppression=smooth(eyeBrightness.y / 240.0, 0.4, 0.4)

# Smoothly transition between daytime and nighttime ambient lighting.
#
# This results in a rapid but smooth rampup from 0% to 100% as the sun/moon
# crosses the horizon and becomes the dominant source of light.
#
# A divisor of 0.05 with a 0.90 basis means that the transition occurs in +/-
# 0.3 degrees from the horizon.
#
# Note that worldMoonVector.y is -worldSunVector.y
uniform.float.dayAmbientFade=pow(clamp(0.90 + worldSunVector.y / 0.05, 0.0, 1.0), 4)
variable.float.nightAmbientFade=pow(clamp(0.90 - worldSunVector.y / 0.05, 0.0, 1.0), 4)

# Approximation of the light that the sky casts on to the world.
# This should be close to the actual color of the sky to look natural.
#
#if DAY_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.ambientDaySkyColor=vec3( \
		0.66 * mix(mix(0.08, 0.15, sunProgress), 0.5, rainStrength), \
		0.66 * mix(mix(0.09, 0.30, sunProgress), 0.5, rainStrength), \
		0.66 * mix(mix(0.21, 1.00, sunProgress), 0.6, rainStrength)  \
	)
#elif DAY_SKY_LIGHTING == FANTASY
	uniform.vec3.ambientDaySkyColor=vec3( \
		0.33 * (      0.20 * rainStrength), \
		0.33 * (0.5 - 0.25 * rainStrength), \
		0.33 * (1.0 - 0.75 * rainStrength) \
	)
#else
	uniform.vec3.ambientDaySkyColor=vec3( \
		0.75, \
		0.75, \
		0.75 + 0.1 * sunProgress \
	)
#endif

# Mix the ambient day sky color approximation with a little bit of sunlight.
#
# dayAmbientFade * (ambientDaySkyColor + sunlightBounce * sunlightColor);
variable.vec3.daySkyAmbient=vec3( \
	dayAmbientFade * (ambientDaySkyColor.r + sunlightBounce * sunlightColor.r), \
	dayAmbientFade * (ambientDaySkyColor.g + sunlightBounce * sunlightColor.g), \
	dayAmbientFade * (ambientDaySkyColor.b + sunlightBounce * sunlightColor.b)  \
)

# Moonlight is close enough to the moon sky color
# that we don't consider the night sky separate from moonlight.
# 
# 0.2 * nightAmbientFade * moonlightColor;
#if DAY_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.nightSkyAmbient=vec3( \
		nightAmbientFade * (mix(0.25 * 0.06, 0.05, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.r), \
		nightAmbientFade * (mix(0.5  * 0.06, 0.05, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.g), \
		nightAmbientFade * (mix(1.0  * 0.06, 0.06, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.b)  \
	)
#elif DAY_SKY_LIGHTING == FANTASY
	variable.vec3.nightSkyAmbient=moonlightColor * vec3(0.2 * nightAmbientFade, 0.2 * nightAmbientFade, 0.2 * nightAmbientFade)
#else
	variable.vec3.nightSkyAmbient=vec3( \
		0.175 * (1.0 - 0.5 * rainStrength), \
		0.20  * (1.0 - 0.5 * rainStrength), \
		0.4   * (1.0 - 0.5 * rainStrength)  \
	) * vec3(nightAmbientFade, nightAmbientFade, nightAmbientFade)
#endif

# Blue-ish base ambient color to give a chilling, cold atmosphere in unlit caves and indoor spaces.
# Night vision raises the base ambient color in all spaces.
#ifdef MINISHITA_LIGHTING
	uniform.vec3.skyAmbient=skyAmbientMinishita
	uniform.vec3.minAmbient=minAmbientMinishita
#else
	uniform.vec3.skyAmbient=daySkyAmbient + nightSkyAmbient
	uniform.vec3.minAmbient=vec3(\
		0.02 * 0.33 + nightVision * (0.5 + 4.0 * nightSkyAmbient.r), \
		0.02 * 0.8  + nightVision * (0.5 + 4.0 * nightSkyAmbient.g), \
		0.02 * 1.0  + nightVision * (0.5 + 4.0 * nightSkyAmbient.b))
#endif

### CUSTOM UNIFORMS: Nighttime color desaturation
uniform.float.desaturationIntensity=0.66 * (1.0 - dayAmbientFade) * (1.0 - 0.6 * nightVision)
uniform.vec3.desaturationColor=vec3(0.33, 0.5, 1.0)

### CUSTOM UNIFORMS: General composite shader uniforms

# A multiplier to convert from window space (measured in pixels / texels)
# to screen space (0.0 to 1.0).
uniform.vec2.windowToScreen=vec2(1.0 / viewWidth, 1.0 / viewHeight)

# The same, but to NDC space.
uniform.vec2.windowToNdc=vec2(2.0 / viewWidth, 2.0 / viewHeight)

### CUSTOM UNIFORMS: Godrays (Screen-Space Light Shafts)

# Same as windowToScreen, but accounting for the godrays rendering scale.
uniform.vec2.windowToScreenGodrays=vec2(1.0 / (0.5 * viewWidth), 1.0 / (0.5 * viewHeight))

# In view space, the forward direction is ALWAYS towards negative Z, that is,
# (0.0, 0.0, -1.0). We want the dot product of the view-space shadow light
# vector with this forward vector, but that ends up just being the following:
variable.float.LdotF=-lightVector.z

# Fade out godrays gradually as you look away from the light. At 60 degrees,
# godrays are no longer visible. This is required to avoid flickering and flashing
# artifacts at high view angles, as well as godrays coming from the exact opposite
# direction as the light.
variable.float.godraysMaxAngle=cos(degrees(60.0))
variable.float.godraysViewAngleFade=pow(max(0.0, (LdotF - godraysMaxAngle) / (1.0 - godraysMaxAngle)), 2.0)

# Even if we are looking within 60 degrees of the sun, the shadow light position can go off-screen if
# we look through a spyglass or otherwise zoom in. This is an additional protection against
# that, explicitly fading away godrays when the shadow-casting light is off-screen.
variable.float.godraysOffscreenFade=if(clipLightVector.w > 0.0, \
	min( \
		(1.0 - max(abs(ndcLightVector.x), abs(ndcLightVector.y))) / 0.1, \
		1.0 \
	), \
	0.0)

# At night, tune the godrays based on moonlight brightness and sky brightness.
# Without this tuning, for very dark skies, the godrays will be too bright, but
# for very bright skies, they will be too dark.

#if NIGHT_ATMOSPHERE == FANTASY
	variable.float.godraysNightExposure=0.64
#elif NIGHT_SKY_LIGHTING == RETRO
	variable.float.godraysNightExposure=0.04
#else
	variable.float.godraysNightExposure=0.16
#endif

# Weaken godrays during the day because they get a bit too obtrusive
# with bright white sunlight.

#if DAY_SKY_LIGHTING == RETRO
	variable.float.godraysDayExposureMorning=0.40
	variable.float.godraysDayExposureNoon=0.20
#elif DAY_SKY_LIGHTING == FANTASY
	variable.float.godraysDayExposureMorning=0.24
	variable.float.godraysDayExposureNoon=0.08
#else
	variable.float.godraysDayExposureMorning=0.16
	variable.float.godraysDayExposureNoon=0.08
#endif

# Tune godrays exposure based on time of day and the lighting colors / sky colors
# to try to make sure they are balanced relative to the background.
variable.float.godraysBaseExposure=if(\
	worldSunVector.y > 0.0, \
	mix(godraysDayExposureMorning, godraysDayExposureNoon, sunProgress), \
	godraysNightExposure)

# The final godrays exposure is the product of the view-angle fade and the time-of-day
# exposure value.
uniform.float.godraysExposure=godraysBaseExposure * godraysViewAngleFade * godraysOffscreenFade

# Godrays are the color of the direct light. Pre-multiply in the exposure value so
# the shader can skip a multiply for free.
uniform.vec3.godraysColor=vec3( \
	directLightSurface.r * godraysExposure, \
	directLightSurface.g * godraysExposure, \
	directLightSurface.b * godraysExposure)
